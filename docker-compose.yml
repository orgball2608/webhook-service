# Application
  kafka_consumer:
    build:
      dockerfile: Dockerfile
      context: .
    platform: linux/amd64
    command:
      - ./webhook_service
      - kafka_consumer
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./files:/app/files
      - ./config/docker.yaml:/app/config/docker.yaml:ro
    environment:
      - CONFIG_PATH=/app/config/docker.yaml
      - DB_HOST=mysql_app
      - DB_PORT=3306
      - DB_USER=app_user
      - DB_PASS=pwd123
      - KAFKA_BROKERS=broker:29092
    depends_on:
      - broker
      - temporal
      - mysql_app
      - redis

  temporal_worker:
    build:
      dockerfile: Dockerfile
      context: .
    platform: linux/amd64
    command:
      - ./webhook_service
      - temporal_worker
    restart: always
    ports:
      - "8082:8082"
    volumes:
      - ./files:/app/files
      - ./config/docker.yaml:/app/config/docker.yaml:ro
    environment:
      - CONFIG_PATH=/app/config/docker.yaml
      - DB_HOST=mysql_app
      - DB_PORT=3306
      - DB_USER=app_user
      - DB_PASS=pwd123
      - KAFKA_BROKERS=broker:29092
    depends_on:
      - broker
      - temporal
      - mysql_app
      - redis

  cron_worker:
    build:
      dockerfile: Dockerfile
      context: .
    platform: linux/amd64
    command:
      - ./webhook_service
      - temporal_cron_worker
    restart: always
    ports:
      - "8084:8084"
    volumes:
      - ./files:/app/files
      - ./config/docker.yaml:/app/config/docker.yaml:ro
    environment:
      - CONFIG_PATH=/app/config/docker.yaml
      - DB_HOST=mysql_app
      - DB_PORT=3306
      - DB_USER=app_user
      - DB_PASS=pwd123
      - KAFKA_BROKERS=broker:29092
    depends_on:
      - broker
      - temporal
      - mysql_app
      - redis

# Iteration 1 will be 100 msg produce to Kafka
  produce_batch_kafka_messages:
    image: mostafamoradian/xk6-kafka:latest
    platform: linux/amd64
    command: run --vus 1 --iterations 10 --duration 2s /testing/kafka_load_test.js
    volumes:
      - ./testing/kafka_load_test.js:/testing/kafka_load_test.js
    depends_on:
      - broker

  db_init:
    image: mysql:${MYSQL_VERSION}
    platform: linux/amd64
    command: sh -c "mysql -h mysql_app -u root -proot webhook < /init.sql"
    volumes:
      - ./testing/db/init.sql:/init.sql
    depends_on:
      - mysql_app

volumes:
  mysql_data:
